name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: https://ulnomncbhccqrynzlqqf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_USfwfy2ONPItJiHlwecXZw_EF9x49Rp
        run: npm run build

      - name: Prepare static files
        run: |
          cd dist/client
          cp _shell.html index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/client
          destination_dir: .
          keep_files: false
          force_orphan: true
          enable_jekyll: false