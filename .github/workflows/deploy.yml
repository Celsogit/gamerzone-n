name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          VITE_SUPABASE_URL: https://ulnomncbhccqrynzlqqf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_USfwfy2ONPItJiHlwecXZw_EF9x49Rp
        run: npm run build

      - name: Prepare static files
        run: |
          if [ -d dist/client ]; then SRC=dist/client; else SRC=dist; fi
          echo "Publicando desde: $SRC"
          ls -la "$SRC"
          # Red de seguridad: si el build no generó index.html, usamos el shell.
          if [ ! -f "$SRC/index.html" ]; then cp "$SRC/_shell.html" "$SRC/index.html"; fi
          # GitHub Pages sirve 404.html en rutas desconocidas; así el SPA
          # arranca igual cuando alguien entra por un enlace directo.
          cp "$SRC/index.html" "$SRC/404.html"
          # Evita que Jekyll ignore carpetas que empiezan con guion bajo.
          touch "$SRC/.nojekyll"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: .
          keep_files: false
          force_orphan: true
          enable_jekyll: false