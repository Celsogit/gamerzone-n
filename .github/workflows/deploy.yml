name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Debug environment
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-NOT SET}"
          echo "VITE_SUPABASE_ANON_KEY set: ${VITE_SUPABASE_ANON_KEY:+yes}"

      - name: Build
        env:
          VITE_SUPABASE_URL: https://ulnomncbhccqrynzlqqf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_USfwfy2ONPItJiHlwecXZw_EF9x49Rp
        run: |
          set +e
          npm run build > build.log 2>&1
          BUILD_EXIT=$?
          cat build.log
          echo "=== Build exit code: $BUILD_EXIT ==="
          ls -la dist/ 2>/dev/null || echo "No dist directory"
          ls -la dist/client/ 2>/dev/null || echo "No dist/client directory"
          exit $BUILD_EXIT

      - name: Prepare static files
        run: |
          cd dist/client
          cp _shell.html index.html
          cp _shell.html 404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4